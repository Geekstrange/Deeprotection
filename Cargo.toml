[package]
name = "dp"
version = "2.1.0-lts"
edition = "2021"

[[bin]]
name = "dp"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
rustyline = { version = "14", features = ["buffer-redux"] }
regex = "1.10"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
ctrlc = "3"
users = "0.11"
fluent = "0.16"
fluent-bundle = "0.15"
unic-langid = { version = "0.9", features = ["macros"] }
intl-memoizer = "0.5"
walkdir = "2.4"
terminal_size = "0.3"
sha2 = "0.10"
rpassword = "7"
libc = "0.2"
