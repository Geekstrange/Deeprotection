name: ✨ Feature Request
description: Suggest an enhancement for Deeprotection (LTS).
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Deeprotection LTS! ✨

        - 🔎 Search [existing issues](https://github.com/Geekstrange/Deeprotection/issues) first.
        - 🛡️ **LTS prioritizes stability.** New features are developed on `main` / `canary` and are only backported to `lts` when security-critical or a critical bug fix — please explain the stability risk and why LTS needs it.
        - 🔒 Security issues are **not** feature requests — report them privately per [SECURITY.md](https://github.com/Geekstrange/Deeprotection/blob/lts/SECURITY.md).

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of the problem or limitation you are facing.
      placeholder: "I'm always frustrated when ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: What you want to happen, including any proposed syntax, config keys, or CLI flags.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Other approaches or existing workarounds.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Parser / expansion
        - Executor / pipelines
        - Built-in commands
        - Security rules engine
        - Path protection
        - Plugin system
        - Interactive editor
        - Configuration
        - Audit logging
        - Job control
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: justification
    attributes:
      label: Why does this need to land in LTS?
      description: LTS favors stability; help us judge the trade-off.
      options:
        - Security-critical
        - Critical bug / missing capability for production
        - Compliance or enterprise requirement
        - Nice to have (should target main/canary instead)
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, references, or upstream shells (bash / brush / nushell) that already do this.
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: I agree to follow this project's Code of Conduct.
          required: true

